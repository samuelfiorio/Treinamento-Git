stages:
  - validate

validate_git_training:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash git grep
    - git fetch origin '+refs/heads/*:refs/remotes/origin/*'
  script:
    - bash ./scripts/ci-validate.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "feature/task-list"'
    - if: '$CI_COMMIT_BRANCH == "feature/about-page"'
